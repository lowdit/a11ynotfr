{{/* Navigation alimentée par menus.main (front matter) — brouillons exclus en prod */}}
<nav class="a11ynot-nav" aria-label="Sections a11yNot">
  <ul class="a11ynot-nav-list">
    {{- $page := . -}}
    {{- range site.Menus.main.ByWeight -}}
    <li>
      <a href="{{ .URL }}"
        {{- if or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }} aria-current="page"{{ end -}}
      >{{ .Name }}</a>
    </li>
    {{- end -}}
  </ul>
</nav>
