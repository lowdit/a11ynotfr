title = "a11yNot en français"
description = "Contre-exemples WCAG et règles outils pour auditeurs francophones — formation et calibration."
defaultContentLanguage = "fr"
locale = "fr-FR"
ignoreLogs = ["warning-goldmark-raw-html"]
theme = ["higo"]

[frontmatter]
date = [":filename", ":default"]

[outputs]
home = ["HTML", "SITEMAP"]
section = ["HTML", "SITEMAP"]
page = ["HTML"]

[params]
moto = "Communauté auditeurs — comprendre les échecs, pas certifier un site réel"
github = "https://github.com/lowdit/a11ynotfr"
license = "MIT (code) · CC BY 4.0 (contenus éditoriaux)"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

# Menus : définis dans le front matter de chaque page (menus.main).
# draft: true → absent du menu (sauf hugo server -D / --buildDrafts).
